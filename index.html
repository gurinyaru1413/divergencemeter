<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050907">
<title>DIVERGENCE METER // WORLD LINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root{color-scheme:dark;--green:#83ff9b;--amber:#ff9c52;--bg:#050907}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#d9ffe0;font-family:'Share Tech Mono','Courier New',monospace}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#102319 0,#07100b 42%,#020403 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(130,255,150,.07) 4px,transparent 5px);mix-blend-mode:screen}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 42%,rgba(0,0,0,.72) 100%)}
main{width:min(1000px,96vw);padding:clamp(18px,4vw,48px) 14px;position:relative;text-align:center;animation:boot .9s ease-out both;z-index:1}
.kicker{font-size:clamp(10px,1.4vw,13px);letter-spacing:.42em;color:#6d9b78;margin-bottom:clamp(28px,5vh,54px)}
.device{position:relative;margin:auto;padding:clamp(15px,3vw,30px);width:fit-content;max-width:100%;border:1px solid rgba(128,255,155,.24);background:linear-gradient(145deg,rgba(25,43,31,.78),rgba(2,7,4,.94));box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 45px rgba(50,255,105,.08),inset 0 0 35px rgba(0,0,0,.8)}
.device:before,.device:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#40664a;box-shadow:inset 0 0 2px #000;top:8px}.device:before{left:8px}.device:after{right:8px}
.readout{display:flex;align-items:center;justify-content:center;gap:clamp(3px,1vw,10px);max-width:100%}
.tube{position:relative;width:clamp(31px,7.7vw,76px);height:clamp(82px,20vw,174px);flex:0 1 auto;border:1px solid rgba(161,255,176,.26);border-radius:48% 48% 15% 15% / 17% 17% 7% 7%;overflow:hidden;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(14,29,19,.88) 22%,rgba(0,0,0,.94) 78%,rgba(45,70,48,.25));box-shadow:inset 0 0 14px #000,0 0 7px rgba(96,255,132,.05)}
.tube:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.32) 4px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 3px 5px);opacity:.68}
.tube:after{content:"";position:absolute;inset:5px 4px;border:1px solid rgba(255,255,255,.045);border-radius:inherit;z-index:3;pointer-events:none}
.stack{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(47px,12vw,120px);line-height:1;font-weight:400;letter-spacing:-.08em}
.ghost{color:#a8ffb3;opacity:.075;filter:blur(.35px);transform:scaleX(.83);white-space:pre;letter-spacing:-.18em}
.digit{color:var(--amber);text-shadow:0 0 2px #ffd0a3,0 0 7px #ff8a36,0 0 17px rgba(255,117,36,.78),0 0 28px rgba(255,102,24,.3);animation:flicker 5s infinite}
.dot{width:clamp(5px,1.1vw,10px);height:clamp(5px,1.1vw,10px);border-radius:50%;background:var(--amber);box-shadow:0 0 8px #ff8a36,0 0 18px rgba(255,117,36,.7);align-self:flex-end;margin:0 clamp(0px,.25vw,3px) clamp(13px,3vw,26px);flex:0 0 auto}
.label{display:flex;justify-content:space-between;gap:24px;margin-top:22px;color:#71977a;font-size:clamp(9px,1.3vw,12px);letter-spacing:.18em}
.status{margin-top:clamp(28px,5vh,48px);font-size:clamp(10px,1.4vw,13px);letter-spacing:.3em;color:#9ed7a7;animation:pulse 2.8s infinite}
.sub{margin-top:12px;font-size:10px;letter-spacing:.12em;color:#47694e}
@keyframes boot{0%{opacity:0;filter:brightness(4);transform:scale(1.025)}35%{opacity:.7}60%{opacity:.3}100%{opacity:1;filter:brightness(1);transform:scale(1)}}
@keyframes flicker{0%,18%,20%,55%,57%,100%{opacity:1}19%,56%{opacity:.84}72%{opacity:.96}73%{opacity:.88}}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1;text-shadow:0 0 10px rgba(105,255,140,.35)}}
@media(max-width:440px){.device{padding:12px 8px}.tube{width:8.2vw;height:21vw}.stack{font-size:12vw}.label{letter-spacing:.08em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main aria-label="ダイバージェンスメーター">
  <div class="kicker">FUTURE GADGET LABORATORY</div>
  <section class="device" aria-label="現在の世界線変動率">
    <div class="readout" id="readout" aria-live="polite" aria-label="世界線変動率"></div>
    <div class="label"><span>WORLD LINE</span><span id="serial">NO. 001</span></div>
  </section>
  <div class="status">DIVERGENCE VALUE CONFIRMED</div>
  <div class="sub">EL PSY KONGROO</div>
</main>
<script>
(() => {
  // 通常は 0.xxxxxx、まれに 1.xxxxxx を表示する世界線変動率
  // 99.5% は 0.000000〜0.999999、0.5% の確率で 1.000000〜1.999999。
  // ページを開くたびに新しい値を生成する。
  const value = Math.random() < 0.995
    ? Math.random().toFixed(6)
    : (1 + Math.random()).toFixed(6);
  sessionStorage.setItem('worldline-value', value);
  sessionStorage.setItem('worldline-generated', 'yes');
  const readout = document.getElementById('readout');
  [...value].forEach((char) => {
    if (char === '.') {
      const dot = document.createElement('span'); dot.className = 'dot'; dot.setAttribute('aria-hidden','true'); readout.appendChild(dot);
    } else {
      const tube = document.createElement('span'); tube.className = 'tube';
      const ghost = document.createElement('span'); ghost.className = 'stack ghost'; ghost.textContent = '0123456789';
      const digit = document.createElement('span'); digit.className = 'stack digit'; digit.textContent = char;
      tube.append(ghost, digit); readout.appendChild(tube);
    }
  });
  document.getElementById('serial').textContent = 'NO. ' + String(Math.floor(Math.random()*999)+1).padStart(3,'0');
  document.querySelector('.status').textContent = 'DIVERGENCE VALUE CONFIRMED';
})();
</script>
</body>
</html>
